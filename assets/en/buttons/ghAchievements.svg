<svg xmlns="http://www.w3.org/2000/svg" width="329" height="72" viewBox="0 0 329 72" role="img" aria-labelledby="t">
<title id="t">GitHub achievements</title>
<style>@font-face{font-family:es-bodyBold;src:url(data:font/woff2;base64,) format("woff2")}.f-bodyBold{font-family:es-bodyBold,'Segoe UI',system-ui,Arial,sans-serif}
text{white-space:pre}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.6)}}
.spin{animation:spin 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
.fade{animation:fade .8s cubic-bezier(.16,1,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .6s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.grow{animation:grow 1.2s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.nudge{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.breathe{animation:breathe 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path d="M16 8L319 8L319 12L323 12L323 16L327 16L327 62L323 62L323 66L319 66L319 70L16 70L16 66L12 66L12 62L8 62L8 16L12 16L12 12L16 12Z" fill="#15111a"/><path d="M10 2L313 2L313 6L317 6L317 10L321 10L321 56L317 56L317 60L313 60L313 64L10 64L10 60L6 60L6 56L2 56L2 10L6 10L6 6L10 6Z" fill="#15111a"/><path d="M13 5L310 5L310 9L314 9L314 13L318 13L318 53L314 53L314 57L310 57L310 61L13 61L13 57L9 57L9 53L5 53L5 13L9 13L9 9L13 9Z" fill="#f4f0e8"/>
<g shape-rendering="crispEdges" ><rect x="34" y="22.5" width="3" height="3" fill="#c79f00"/><rect x="31" y="25.5" width="9" height="3" fill="#c79f00"/><rect x="22" y="28.5" width="27" height="3" fill="#c79f00"/><rect x="25" y="31.5" width="21" height="3" fill="#c79f00"/><rect x="28" y="34.5" width="15" height="3" fill="#c79f00"/><rect x="25" y="37.5" width="9" height="3" fill="#c79f00"/><rect x="37" y="37.5" width="9" height="3" fill="#c79f00"/><rect x="25" y="40.5" width="6" height="3" fill="#c79f00"/><rect x="40" y="40.5" width="6" height="3" fill="#c79f00"/></g>
<text x="63" y="41" class="f-bodyBold" font-size="22" fill="#15111a" >GitHub achievements</text>
</svg>