<svg xmlns="http://www.w3.org/2000/svg" width="600" height="268" viewBox="0 0 600 268" role="img" aria-labelledby="t">
<title id="t">03 — Missions. Projects told as missions. Click one to open it.</title>
<style>@font-face{font-family:es-pixelBold;src:url(data:font/woff2;base64,) format("woff2")}.f-pixelBold{font-family:es-pixelBold,ui-monospace,Consolas,monospace}@font-face{font-family:es-display;src:url(data:font/woff2;base64,) format("woff2")}.f-display{font-family:es-display,'Arial Narrow','Helvetica Neue',Arial,sans-serif}@font-face{font-family:es-body;src:url(data:font/woff2;base64,) format("woff2")}.f-body{font-family:es-body,'Segoe UI',system-ui,Arial,sans-serif}
text{white-space:pre}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.6)}}
.spin{animation:spin 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
.fade{animation:fade .8s cubic-bezier(.16,1,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .6s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.grow{animation:grow 1.2s cubic-bezier(.16,1,.3,1) both;transform-box:fill-box;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.nudge{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.breathe{animation:breathe 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes breathe{50%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){
.bob,.nudge,.breathe{animation:none}
.spin{animation:glint 2.8s ease-in-out infinite}
@keyframes glint{50%{opacity:.45}}
.twinkle{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.2}}
.fade{animation:show .8s ease both}.pop{animation:show .6s ease both}
@keyframes show{from{opacity:0}}
}</style>
