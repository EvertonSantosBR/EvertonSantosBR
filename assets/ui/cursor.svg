<svg xmlns="http://www.w3.org/2000/svg" width="18" height="28" viewBox="0 0 18 28" role="presentation">
<style>
text{white-space:pre}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bob{animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.twinkle{animation:twinkle 2.4s steps(3) infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g shape-rendering="crispEdges" ><rect x="0" y="0" width="3" height="3" fill="#15111a"/><rect x="0" y="3" width="6" height="3" fill="#15111a"/><rect x="0" y="6" width="3" height="3" fill="#15111a"/><rect x="3" y="6" width="3" height="3" fill="#ffcc00"/><rect x="6" y="6" width="3" height="3" fill="#15111a"/><rect x="0" y="9" width="3" height="3" fill="#15111a"/><rect x="3" y="9" width="6" height="3" fill="#ffcc00"/><rect x="9" y="9" width="3" height="3" fill="#15111a"/><rect x="0" y="12" width="3" height="3" fill="#15111a"/><rect x="3" y="12" width="9" height="3" fill="#ffcc00"/><rect x="12" y="12" width="3" height="3" fill="#15111a"/><rect x="0" y="15" width="3" height="3" fill="#15111a"/><rect x="3" y="15" width="6" height="3" fill="#ffcc00"/><rect x="9" y="15" width="3" height="3" fill="#15111a"/><rect x="0" y="18" width="3" height="3" fill="#15111a"/><rect x="3" y="18" width="3" height="3" fill="#ffcc00"/><rect x="6" y="18" width="3" height="3" fill="#15111a"/><rect x="0" y="21" width="6" height="3" fill="#15111a"/><rect x="0" y="24" width="3" height="3" fill="#15111a"/></g>
</svg>